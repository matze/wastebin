<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wastebin themes</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 32px clamp(16px, 4vw, 48px) 64px;
        background: #14161a;
        color: #e6e8ec;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }

      h1 { font-size: 1.5rem; margin: 0 0 4px; }

      section { margin: 0 0 40px; }

      h2 {
        margin: 0 0 12px;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #cfd5de;
      }

      .panes {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      @media (max-width: 1560px) {
        .panes { grid-template-columns: minmax(0, 1fr); }
      }

      iframe {
        display: block;
        width: 100%;
        height: 780px;
        border: 1px solid #2a2f37;
        border-radius: 10px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>wastebin themes</h1>
    {% for group in groups %}
      <section>
        <h2>{{ group.name }}</h2>
        <div class="panes">
          {% for pane in group.panes %}
            <iframe title="{{ group.name }} {{ pane.scheme }} {{ pane.view.name() }}" loading="lazy" srcdoc="{{ pane.document }}"></iframe>
          {% endfor %}
        </div>
      </section>
    {% endfor %}
  </body>
</html>
